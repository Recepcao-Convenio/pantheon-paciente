<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantheon Paciente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F4F3F8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pantheon">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: coluna única (máx. 560px), cabeçalho e barra inferior em vidro claro; cartões brancos com borda fina
   e sombra em camadas; o cartão do próximo atendimento em tinta escura como peça de destaque.
   Identidade: porcelana fria + violeta Pantheon + ouro; números em fonte mono. Visual claro único, escolhido de propósito. */
:root {
  --fundo: #F4F3F8;
  --superficie: #FFFFFF;
  --superficie-2: #FAF9FD;
  --vidro: rgba(255,255,255,.78);
  --linha: #E5E2EE;
  --linha-forte: #D5D0E2;
  --texto: #14101C;
  --texto-2: #5D5570;
  --texto-3: #958DA6;
  --tinta: #17112A;
  --acento: #5A3ED0;
  --acento-2: #8A6CF2;
  --acento-suave: #EFEBFD;
  --ouro: #A6803A;
  --ouro-claro: #D9AE58;
  --ok: #17845A; --ok-suave: #E3F5EC;
  --alerta: #9A6B0E; --alerta-suave: #FBF1DC;
  --erro: #C0392F; --erro-suave: #FCE9E7;
  --neutro-suave: #EFEDF4;
  --sombra: 0 1px 2px rgba(23,17,42,.04), 0 4px 14px rgba(23,17,42,.05);
  --sombra-alta: 0 2px 4px rgba(23,17,42,.04), 0 18px 40px -12px rgba(48,30,110,.22);
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-corpo: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --raio: 18px;
  color-scheme: light;
}

* { box-sizing: border-box }
html, body { height: 100% }
body {
  background: var(--fundo); color: var(--texto); font-family: var(--f-corpo); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(800px 420px at 100% -8%, rgba(138,108,242,.13), transparent 62%),
    radial-gradient(640px 380px at -12% 22%, rgba(214,178,110,.12), transparent 60%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fundo) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
a { -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.025em }
p { margin: 0 }
.miudo { font-size: 13px; color: var(--texto-2) }
.rotulo { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ouro); font-weight: 600 }

/* Capa / login */
.capa { min-height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 52px 32px;
  background:
    radial-gradient(520px 360px at 15% 0%, rgba(138,108,242,.22), transparent 70%),
    radial-gradient(480px 340px at 95% 18%, rgba(214,178,110,.22), transparent 70%),
    var(--fundo); }
.capa-topo { max-width: 440px; width: 100%; margin: 0 auto; display: grid; gap: 14px; justify-items: center; text-align: center; padding-block: 6px 30px }
.capa-topo h1 { font-size: 32px; color: var(--tinta) }
.capa-topo p { color: var(--texto-2); max-width: 30ch }
.marca { width: 56px; height: 56px; color: var(--ouro) }
.capa-topo .marca { width: 68px; height: 68px; padding: 14px; border-radius: 20px; color: var(--ouro-claro);
  background: linear-gradient(150deg, #2B2048, #120C22); box-shadow: 0 14px 30px -10px rgba(48,30,110,.55), inset 0 1px 0 rgba(255,255,255,.12) }
.cartao-login { max-width: 440px; width: 100%; margin: 0 auto; background: var(--vidro); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.9); border-radius: 24px; padding: 22px 20px 24px; display: grid; gap: 16px; box-shadow: var(--sombra-alta) }
.segmento { display: grid; grid-template-columns: 1fr 1fr; background: var(--neutro-suave); border-radius: 14px; padding: 4px; gap: 4px }
.segmento button { border: 0; background: transparent; padding: 9px 8px; border-radius: 10px; font-weight: 600; color: var(--texto-2) }
.segmento button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: 0 1px 3px rgba(23,17,42,.12) }
.capa-rodape { text-align: center; color: var(--texto-3); font-size: 12.5px; margin-top: 22px }

/* Formulários */
form { display: grid; gap: 14px }
.campo { display: grid; gap: 6px }
.campo label { font-weight: 600; font-size: 13px; color: var(--texto-2) }
.campo input, .campo textarea { width: 100%; border: 1px solid var(--linha-forte); background: var(--superficie); border-radius: 12px; padding: 13px 14px; font-size: 16px; transition: border-color .15s, box-shadow .15s }
.campo input::placeholder, .campo textarea::placeholder { color: var(--texto-3) }
.campo input:focus, .campo textarea:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 4px rgba(90,62,208,.12) }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--texto-2) }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--acento); flex: none }
.erro-msg { background: var(--erro-suave); color: var(--erro); border: 1px solid rgba(192,57,47,.18); border-radius: 12px; padding: 10px 12px; font-size: 14px }
.info-msg { background: var(--acento-suave); color: var(--tinta); border: 1px solid rgba(90,62,208,.16); border-radius: 12px; padding: 10px 12px; font-size: 14px }

.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform .12s, filter .15s, box-shadow .15s }
.btn:active { transform: scale(.98) }
.btn-primario { background: linear-gradient(135deg, #2C2050 0%, #4A33B0 60%, #6A4EE0 100%); color: #fff; box-shadow: 0 12px 26px -10px rgba(74,51,176,.6), inset 0 1px 0 rgba(255,255,255,.18) }
.btn-primario:hover { filter: brightness(1.08) }
.btn-secundario { background: var(--acento-suave); color: var(--acento) }
.btn-linha { background: var(--superficie); border: 1px solid var(--linha-forte); color: var(--texto) }
.btn-perigo { background: var(--erro); color: #fff }
.btn-texto { background: none; border: 0; color: var(--acento); font-weight: 600; padding: 6px 0; display: inline-flex; align-items: center; gap: 4px }
.btn[disabled] { opacity: .5; cursor: default; box-shadow: none }
.btn-bloco { width: 100% }

/* App */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--vidro); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
  border-bottom: 1px solid var(--linha);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px }
.topo-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px }
.topo-in .marca { width: 30px; height: 30px; padding: 6px; border-radius: 9px; color: var(--ouro-claro); background: linear-gradient(150deg, #2B2048, #120C22) }
.topo-in strong { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; flex: 1; color: var(--tinta) }
.topo-in button { background: var(--superficie); border: 1px solid var(--linha); color: var(--texto-2); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600 }
.demo-faixa { background: var(--alerta-suave); color: var(--alerta); font-size: 12px; text-align: center; padding: 6px 16px; font-weight: 600; font-family: var(--f-mono); letter-spacing: .04em }
main { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px calc(108px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px }
.saudacao { display: grid; gap: 4px }
.saudacao h1 { font-size: 28px; color: var(--tinta) }
.cartao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--sombra) }
.destaque { position: relative; overflow: hidden; color: #F4F0FB; border: 0;
  background: radial-gradient(380px 220px at 105% -10%, rgba(138,108,242,.55), transparent 70%), radial-gradient(260px 200px at -10% 120%, rgba(214,178,110,.28), transparent 70%), linear-gradient(155deg, #251B42, #120C22);
  box-shadow: 0 22px 44px -18px rgba(40,24,100,.6) }
.destaque .rotulo { color: var(--ouro-claro) }
.destaque .miudo { color: #BDB3D3 }
.destaque h2 { font-size: 22px; color: #fff }
.destaque .btn-linha { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff }
.data-grande { display: flex; gap: 14px; align-items: center }
.data-bloco { flex: none; width: 62px; border-radius: 14px; background: rgba(255,255,255,.07); text-align: center; padding: 8px 0 7px; border: 1px solid rgba(233,214,171,.45) }
.data-bloco b { display: block; font-family: var(--f-mono); font-weight: 600; font-size: 24px; line-height: 1.1; color: var(--ouro-claro) }
.data-bloco span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #BDB3D3 }
.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.acao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 15px; text-align: left; display: grid; gap: 10px; align-content: start; color: var(--texto); text-decoration: none; min-height: 112px; box-shadow: var(--sombra); transition: border-color .15s, transform .12s, box-shadow .15s }
.acao svg { width: 36px; height: 36px; padding: 8px; border-radius: 11px; color: var(--acento); background: var(--acento-suave) }
.acao b { font-size: 14.5px; font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em }
.acao span { font-size: 12.5px; color: var(--texto-2) }
.acao:hover { border-color: rgba(90,62,208,.35); box-shadow: var(--sombra-alta) }
.acao:active { transform: scale(.985) }
.linha-botoes { display: flex; gap: 8px; flex-wrap: wrap }
.linha-botoes .btn { flex: 1 1 130px }

/* Etapas de agendamento */
.etapas { display: flex; gap: 6px }
.etapas i { flex: 1; height: 3px; border-radius: 3px; background: var(--linha) }
.etapas i.feita { background: linear-gradient(90deg, var(--ouro), var(--acento)) }
.cab-etapa { display: grid; gap: 6px }
.cab-etapa h2 { font-size: 24px; color: var(--tinta) }
.lista-op { display: grid; gap: 8px }
.op { width: 100%; text-align: left; background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; padding: 13px 14px; display: flex; gap: 12px; align-items: center; color: var(--texto); text-decoration: none; box-shadow: var(--sombra); transition: border-color .15s, box-shadow .15s }
.op:hover { border-color: rgba(90,62,208,.35) }
.op[aria-pressed="true"] { border-color: var(--acento); box-shadow: 0 0 0 3px rgba(90,62,208,.12) }
.op .txt { flex: 1; min-width: 0; display: grid; gap: 1px }
.op .txt b { font-weight: 600 }
.op .txt span { font-size: 13px; color: var(--texto-2) }
.op .seta { color: var(--texto-3); display: grid }
.op-whats { background: var(--superficie-2); border-style: dashed }
.op-whats .txt span { color: var(--ok) }
.op-whats .seta { color: var(--ok) }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 600; font-size: 13px; font-family: var(--f-mono); color: var(--ouro-claro); background: linear-gradient(150deg, #2B2048, #120C22) }
.dias { overflow-x: auto; display: flex; gap: 8px; padding: 2px 2px 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none }
.dias::-webkit-scrollbar { display: none }
.dia { flex: none; width: 64px; border: 1px solid var(--linha); background: var(--superficie); border-radius: 14px; padding: 9px 0; display: grid; justify-items: center; gap: 2px; scroll-snap-align: start; box-shadow: var(--sombra) }
.dia span { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--texto-2) }
.dia b { font-size: 21px; font-family: var(--f-mono); font-weight: 600; color: var(--tinta) }
.dia:hover { border-color: rgba(90,62,208,.35) }
.dia[aria-pressed="true"] { background: linear-gradient(155deg, #2C2050, #5A3ED0); border-color: transparent; box-shadow: 0 10px 22px -8px rgba(74,51,176,.6) }
.dia[aria-pressed="true"] span { color: rgba(255,255,255,.72) }
.dia[aria-pressed="true"] b { color: #fff }
.horarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px }
.hora { border: 1px solid var(--linha); background: var(--superficie); border-radius: 12px; padding: 11px 0; font-weight: 600; font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--tinta); box-shadow: var(--sombra) }
.hora:hover { border-color: var(--acento); color: var(--acento) }
.hora[aria-pressed="true"] { background: linear-gradient(155deg, #2C2050, #5A3ED0); color: #fff; border-color: transparent }
.resumo { display: grid; gap: 10px; margin: 0 }
.resumo div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--linha-forte); padding-bottom: 10px }
.resumo div:last-child { border-bottom: 0; padding-bottom: 0 }
.resumo dt { color: var(--texto-2); font-size: 13px }
.resumo dd { margin: 0; font-weight: 600; text-align: right }

/* Medicações */
.grupo-med { display: grid; gap: 8px }
.op .caixa { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--linha-forte); background: var(--superficie); display: grid; place-items: center }
.op .caixa.marcada { background: linear-gradient(155deg, #2C2050, #5A3ED0); border-color: transparent }
.op .caixa.marcada::after { content: ""; width: 10px; height: 6px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px) }
.op .preco { flex: none; font-family: var(--f-mono); font-weight: 600; font-size: 13.5px; color: var(--tinta) }
.op .preco.riscado { text-decoration: line-through; color: var(--texto-3) }
.barra-total { position: sticky; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--vidro); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--linha); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: var(--sombra-alta) }
.barra-total > div { display: grid; gap: 0 }
.barra-total b { font-family: var(--f-mono); font-size: 18px; color: var(--tinta) }
.barra-total .btn { padding: 12px 20px }

/* Agendamentos */
.abas { display: grid; grid-template-columns: 1fr 1fr; background: var(--neutro-suave); border-radius: 14px; padding: 4px; gap: 4px }
.abas button { background: none; border: 0; padding: 9px; border-radius: 10px; font-weight: 600; color: var(--texto-2) }
.abas button[aria-pressed="true"] { color: var(--texto); background: var(--superficie); box-shadow: 0 1px 3px rgba(23,17,42,.12) }
.ag { display: grid; gap: 10px }
.ag-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.ag-cab h3 { font-family: var(--f-display); font-weight: 600; font-size: 15.5px; letter-spacing: -.01em }
.ag-quando { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--acento) }
.pilula { flex: none; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px }
.pilula::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.st-agendado { background: var(--acento-suave); color: var(--acento) }
.st-confirmado { background: var(--ok-suave); color: var(--ok) }
.st-realizado { background: var(--neutro-suave); color: var(--texto-2) }
.st-cancelado { background: var(--erro-suave); color: var(--erro) }
.st-faltou { background: var(--alerta-suave); color: var(--alerta) }
.confirmar-caixa { background: var(--erro-suave); border: 1px solid rgba(192,57,47,.18); border-radius: 14px; padding: 12px; display: grid; gap: 10px }
.vazio { text-align: center; padding: 30px 16px; display: grid; gap: 12px; justify-items: center; color: var(--texto-2) }
.vazio svg { width: 44px; height: 44px; color: var(--ouro) }

/* Preparo */
details.prep { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 0 16px; box-shadow: var(--sombra) }
details.prep[open] { border-color: rgba(90,62,208,.3) }
details.prep summary { list-style: none; cursor: pointer; padding: 15px 0; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-family: var(--f-display) }
details.prep summary::-webkit-details-marker { display: none }
details.prep summary::after { content: "+"; color: var(--acento); font-family: var(--f-mono); font-size: 18px; line-height: 1 }
details.prep[open] summary::after { content: "–" }
details.prep ul { margin: 0 0 16px; padding-left: 20px; display: grid; gap: 7px }
details.prep li::marker { color: var(--ouro) }
details.prep p { margin-bottom: 12px; color: var(--texto-2); font-size: 13.5px }

/* NPS */
.escala { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px }
.escala button { border: 1px solid var(--linha); background: var(--superficie); border-radius: 10px; padding: 10px 0; font-weight: 600; font-size: 14px; font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.escala button[aria-pressed="true"] { background: linear-gradient(155deg, #2C2050, #5A3ED0); color: #fff; border-color: transparent }
.escala-leg { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-2) }
@media (max-width: 380px) { .escala { grid-template-columns: repeat(6, minmax(0, 1fr)) } }

/* Navegação inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 10px;
  background: linear-gradient(rgba(244,243,248,0), rgba(244,243,248,.92) 45%) }
.nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; gap: 4px;
  background: var(--vidro); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); border: 1px solid rgba(255,255,255,.95); border-radius: 22px; box-shadow: var(--sombra-alta) }
.nav button { background: none; border: 0; padding: 8px 2px; border-radius: 16px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--texto-3) }
.nav svg { width: 22px; height: 22px }
.nav button[aria-current="page"] { color: #fff; background: linear-gradient(155deg, #2C2050, #5A3ED0); box-shadow: 0 8px 18px -8px rgba(74,51,176,.7) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); z-index: 8; background: var(--tinta); color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 14px 34px rgba(23,17,42,.3) }
.carregando { display: grid; place-items: center; padding: 32px; color: var(--texto-2); font-family: var(--f-mono); font-size: 13px; gap: 12px }
.carregando::before { content: ""; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--linha); border-top-color: var(--acento); animation: gira .8s linear infinite }
@keyframes gira { to { transform: rotate(360deg) } }
.whats { display: grid; gap: 6px }
.whats .num { font-family: var(--f-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; user-select: all; color: var(--tinta) }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const so = s => String(s || '').replace(/\D/g, '');
const guardar = {

  set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} },
  del(k) { try { localStorage.removeItem(k) } catch (e) {} }
};
function cpfValido(v) {
  const c = so(v);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== +c[t]) return false;
  }
  return true;
}
function mascaraCPF(v) {
  const c = so(v).slice(0, 11);
  let o = c.slice(0, 3);
  if (c.length > 3) o += '.' + c.slice(3, 6);
  if (c.length > 6) o += '.' + c.slice(6, 9);
  if (c.length > 9) o += '-' + c.slice(9);

}
const fmt = (iso, op) => new Intl.DateTimeFormat('pt-BR', { timeZone: CONFIG.FUSO, ...op }).format(new Date(iso));
const fmtHora = iso => fmt(iso, { hour: '2-digit', minute: '2-digit' });
const fmtDiaLongo = iso => fmt(iso, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDiaCurto = iso => fmt(iso, { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, '');
function diaSP(d = new Date()) {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.FUSO, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  return p; // AAAA-MM-DD
}
function proximosDias(n) {
  const out = []; const base = new Date(diaSP() + 'T12:00:00-03:00');
  for (let i = 0; out.length < n && i < n * 2; i++) {
    const d = new Date(base.getTime() + i * 864e5);
    const iso = diaSP(d);
    const dow = new Date(iso + 'T12:00:00-03:00').getUTCDay();
    if (dow !== 0) out.push(iso); // sem domingos
  }
  return out;
}
const horasAte = iso => (new Date(iso) - Date.now()) / 36e5;
const iniciais = n => String(n || '').replace(/^(Dra?\.?\s+)/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const primeiroNome = n => String(n || '').split(/\s+/)[0] || '';
const STATUS = { agendado: 'Agendado', confirmado: 'Confirmado', realizado: 'Realizado', cancelado: 'Cancelado', faltou: 'Não compareceu' };

/* Ícones */
const I = {

};

/* =====================================================================
   Comunicação com o servidor (ou simulação no modo demonstração)
   ===================================================================== */
const DEMO = !CONFIG.API_URL;
async function api(metodo, caminho, corpo) {
  if (DEMO) return Simulacao.tratar(metodo, caminho, corpo, S.token);
  let r;
  try {
    r = await fetch(CONFIG.API_URL.replace(/\/$/, '') + caminho, {
      method: metodo,
      headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
      body: corpo ? JSON.stringify(corpo) : undefined
    });
  } catch (e) { throw new Error('Sem conexão com a clínica. Verifique sua internet e tente de novo.') }
  let dados = {};
  try { dados = await r.json() } catch (e) {}
  if (r.status === 401 && S.token) { sair(true); throw new Error('Sua sessão expirou. Entre novamente.') }
  if (!r.ok) throw new Error(dados.erro || 'Não foi possível concluir. Tente de novo em instantes.');
  return dados;
}

/* Simulação: mesmas respostas do servidor real, com dados fictícios. */
const Simulacao = (() => {
  const convs = [{ id: '142', nome: 'AFFEGO' }, { id: 'w:BRB', nome: 'BRB (Saúde BRB)', whatsapp: true }, { id: '109', nome: 'PF Saúde (Polícia Federal)' }, { id: '100', nome: 'Saúde Caixa' }, { id: 'w:SERPRO', nome: 'SERPRO', whatsapp: true }, { id: '154', nome: 'ASSEFAZ' }];
  const prof = (id, nome, esp, valor, comConv = true, extra = {}) => ({ id, nome, especialidade: esp, disponivel: true, aviso: '',
    modalidades: [{ id: 'presencial', nome: '', convenios: [{ id: '88', nome: 'Particular', valor }, ...(comConv ? convs : [])] }], ...extra });
  const servicos = [
    { id: 's1', nome: 'Consulta – Nutrologia', categoria: 'consulta', profissionais: [prof('p1', 'Helena Duarte', 'Nutrologia', 450), prof('p2', 'Rafael Moura', 'Nutrologia', 550)] },
    { id: 's2', nome: 'Consulta – Endocrinologia', categoria: 'consulta', profissionais: [prof('p3', 'Lívia Campos', 'Endocrinologia', 700, false), prof('p4', 'André Lins', 'Endocrinologia', 450, true, { disponivel: false, aviso: 'Atende a partir de 16 anos' })] },
    { id: 's3', nome: 'Consulta – Psicologia', categoria: 'consulta', profissionais: [{ id: 'p5', nome: 'Clara Nunes', especialidade: 'Psicologia', disponivel: true, aviso: '',
      modalidades: [{ id: 'presencial', nome: 'Presencial', convenios: [{ id: '88', nome: 'Particular', valor: 150 }] }, { id: 'telemedicina', nome: 'Telemedicina', convenios: [{ id: '88', nome: 'Particular', valor: 100 }] }] }] },
    { id: 's4', nome: 'Medicação', categoria: 'medicacao', profissionais: [{ id: 'p6', nome: 'Sala de medicação', especialidade: '', disponivel: true, aviso: '',
      modalidades: [{ id: 'endovenoso', nome: 'Endovenoso', ev: true, janelas: [['08:00', '11:00'], ['14:00', '16:20']], convenios: [{ id: '88', nome: 'Particular' }] }, { id: 'aplicacao', nome: '', janelas: [['00:00', '11:45'], ['12:00', '16:40']], convenios: [{ id: '88', nome: 'Particular' }] }] }],
      medicacoes: [['Medicações gerais', 'Complexo B (EV)', 350], ['Medicações gerais', 'Complexo B (IM)', 250], ['Medicações gerais', 'Vitamina B12 (EV)', 350], ['Medicações gerais', 'Vitamina B12 (IM)', 250], ['Medicações gerais', 'Vitamina D (IM)', 250],

  ];
  const contas = { '52998224725': { senha: 'pantheon123', nascimento: '1990-05-12', nome: 'Mariana Souza' } };
  const dia = n => diaSP(new Date(Date.now() + n * 864e5));

  let seq = 4;
  const ags = [

  const diasDoProf = { p1: [1, 3, 5], p2: [2, 4], p3: [2], p4: [1, 4], p5: [1, 2, 3, 4, 5], p6: [1, 2, 3, 4, 5, 6] };

      if (!(diasDoProf[profId] || []).includes(dow)) continue;

        const inicio = `${data}T${hh}:00-03:00`;
        const semente = (data + hh + profId).split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
        if (semente % 3 === 0 || new Date(inicio) < Date.now() + 2 * 36e5) continue;
        if (ags.some(a => a.inicio === inicio && a.prof === profId && a.status !== 'cancelado')) continue;
        out.push({ inicio, profissional: { id: profId, nome: pf(profId).nome } });
      }
    }
    return out;
  }
  const erro = m => { throw new Error(m) };
  async function tratar(metodo, caminho, corpo = {}, token) {
    await new Promise(r => setTimeout(r, 280));
    const [rota, qs] = caminho.split('?');
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    if (rota === '/auth/entrar') {
      const c = contas[so(corpo.cpf)];
      if (!c) erro('CPF ainda sem cadastro no app. Use “Primeiro acesso”.');
      if (c.senha !== corpo.senha) erro('CPF ou senha incorretos.');
      return { token: 'demo', paciente: { nome: c.nome } };
    }
    if (rota === '/auth/primeiro-acesso') {
      const cpf = so(corpo.cpf);
      const c = contas[cpf] || (contas[cpf] = { nascimento: corpo.nascimento, nome: 'Paciente Exemplo' });
      if (c.nascimento !== corpo.nascimento) erro('Os dados não conferem com o cadastro da clínica. Fale com a recepção.');
      c.senha = corpo.senha;
      return { token: 'demo', paciente: { nome: c.nome } };
    }
    if (!token) erro('Entre novamente.');
    if (rota === '/servicos') return { servicos };
    if (rota === '/horarios') {
      const md = (pf(q.profissional).modalidades.find(x => x.id === q.modalidade) || {}).janelas;
      return { horarios: livres(q.profissional, q.de || q.data, q.ate || q.data).filter(h => !md || md.some(([a, b]) => h.inicio.slice(11, 16) >= a && h.inicio.slice(11, 16) <= b)) };

      const l = livres(corpo.profissional, corpo.inicio.slice(0, 10), corpo.inicio.slice(0, 10)).find(h => h.inicio === corpo.inicio);

      if (corpo.itens) { const ms = sv(servico).medicacoes.filter(m => corpo.itens.includes(m.id)); n.med = { medicacoes: ms.map(m => ({ nome: m.nome, preco: m.preco })), total: ms.reduce((t, m) => t + m.preco, 0), pacote: !!corpo.pacote } }
      ags.push(n); return n;
    };
    if (rota === '/agendamentos' && metodo === 'POST') return { agendamento: pubAg(reservar(corpo.servico)) };
    let m = rota.match(/^\/agendamentos\/([^/]+)\/(cancelar|remarcar|confirmar)$/);
    if (m) {
      const a = ags.find(x => x.id === m[1]); if (!a) erro('Agendamento não encontrado.');
      if (m[2] === 'confirmar') { a.status = 'confirmado'; return { ok: true } }
      if (horasAte(a.inicio) < CONFIG.ANTECEDENCIA_HORAS) erro(`Alterações só até ${CONFIG.ANTECEDENCIA_HORAS}h antes. Fale com a recepção pelo WhatsApp.`);
      if (m[2] === 'cancelar') { a.status = 'cancelado'; return { ok: true } }
      const n = reservar(corpo.servico || a.servico); a.status = 'cancelado';
      return { agendamento: pubAg(n) };
    }
    if (rota === '/nps') { const a = ags.find(x => x.id === corpo.agendamentoId); if (a) a.avaliado = true; return { ok: true } }
    erro('Rota desconhecida.');
  }
  return { tratar };
})();

};
if (DEMO) { S.token = null } // demonstração sempre começa no login
const app = document.getElementById('app');
let toastTimer;
function toast(t) { S.toast = t; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render() }, 3200) }

function sair(silencioso) {
  S.token = null; S.nome = ''; S.agendamentos = null; S.servicos = null; S.ag = null; S.tela = 'inicio';
  guardar.del('pp_token'); guardar.del('pp_nome');
  if (!silencioso) render();
}
async function carregarAgendamentos(forcar) {
  if (S.agendamentos && !forcar) return;
  const r = await api('GET', '/agendamentos');
  S.agendamentos = (r.agendamentos || []).sort((a, b) => a.inicio.localeCompare(b.inicio));
}
async function carregarServicos() {
  if (S.servicos) return;
  const r = await api('GET', '/servicos');
  S.servicos = r.servicos || [];
}

function proximos() {
  return (S.agendamentos || []).filter(a => new Date(a.inicio) > Date.now() - 36e5 && a.status !== 'cancelado' && a.status !== 'realizado' && a.status !== 'faltou');
}
function anteriores() {
  const p = new Set(proximos().map(a => a.id));
  return (S.agendamentos || []).filter(a => !p.has(a.id)).sort((a, b) => b.inicio.localeCompare(a.inicio));
}
const pendenteAvaliar = () => (S.agendamentos || []).filter(a => a.status === 'realizado' && !a.avaliado).sort((a, b) => b.inicio.localeCompare(a.inicio))[0];

/* ---------- Login ---------- */

  return `<div class="capa">

/* ---------- Agendar (também usado para remarcar) ---------- */
const DIAS_BUSCA = 28;
const moeda = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
const svAtual = g => S.servicos && S.servicos.find(s => s.id === g.servico);
const profAtual = g => { const sv = svAtual(g); return sv && sv.profissionais.find(p => p.id === g.profissional) };
const modAtual = g => { const p = profAtual(g); return p && (p.modalidades.find(m => m.id === g.modalidade) || p.modalidades[0]) };
const convAtual = g => { const m = modAtual(g); return m && m.convenios.find(c => c.id === g.convenio) };
// Etapas do fluxo; modalidade e convênio só aparecem quando há mais de uma opção
function planosDe(conv) {
  if (!conv) return null;
  const n = String(conv.nome).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const k = Object.keys(CONFIG.PLANOS || {}).find(c => n.includes(c));
  return k ? CONFIG.PLANOS[k] : null;
}
function passos(g) {
  const p = profAtual(g), m = modAtual(g);
  if (svAtual(g) && svAtual(g).medicacoes) return ['servico', 'itens', 'hora', 'conf'];
  return ['servico', 'prof', ...(p && p.modalidades.length > 1 ? ['modalidade'] : []), ...(!m || m.convenios.length > 1 ? ['convenio'] : []),
    ...(planosDe(convAtual(g)) ? ['plano'] : []), 'hora', 'conf'];
}
function irPara(etapa) {
  S.ag.etapa = etapa; S.erro = ''; render(); window.scrollTo(0, 0);
  if (etapa === 'hora' && !S.ag.livres) buscarDias();
}
const descJanelas = js => (js || []).map(([a, b]) => (a <= '00:00' || a === '12:00' ? 'até ' : `das ${a.replace(':00', 'h').replace(':', 'h')} às `) + b.replace(':00', 'h').replace(':', 'h')).join(' e ');
const janelasEV = sv => { const p = sv && sv.profissionais[0]; const m = p && p.modalidades.find(x => x.ev); return m && m.janelas ? descJanelas(m.janelas) : '' };
const itensSel = g => { const sv = svAtual(g); return sv && sv.medicacoes ? sv.medicacoes.filter(m => (g.itens || []).includes(m.id)) : [] };
// Define a modalidade pela escolha: alguma EV usa a modalidade com janela de horário (endovenoso)
function modalidadePelosItens(g) {
  const p = profAtual(g); if (!p) return null;
  const comJanela = p.modalidades.find(m => m.ev), outra = p.modalidades.find(m => !m.ev) || p.modalidades[0];
  return (itensSel(g).some(m => m.ev) && comJanela ? comJanela : outra).id;
}
function limparAgenda(g) { g.livres = null; g.ate = null; g.data = null; g.horario = null }
async function buscarDias(mais) {
  const g = S.ag;
  const de = mais && g.ate ? diaSP(new Date(new Date(g.ate + 'T12:00:00-03:00').getTime() + 864e5)) : diaSP();
  const ate = diaSP(new Date(new Date(de + 'T12:00:00-03:00').getTime() + (DIAS_BUSCA - 1) * 864e5));
  g.buscando = true; render();
  try {
    const r = await api('GET', `/horarios?servico=${encodeURIComponent(g.servico)}&profissional=${encodeURIComponent(g.profissional)}&modalidade=${encodeURIComponent(g.modalidade || '')}&convenio=${encodeURIComponent(g.convenio || '')}&de=${de}&ate=${ate}`);
    if (S.ag !== g) return;
    g.livres = (mais && g.livres ? g.livres : []).concat(r.horarios || []);
    g.ate = ate;
    if (!g.data) { const d = g.livres[0]; g.data = d ? d.inicio.slice(0, 10) : null }
  } catch (e) { S.erro = e.message; if (!g.livres) g.livres = [] }
  g.buscando = false; render();
}
function novoFluxo(remarcar) {
  S.ag = { etapa: 'servico', servico: null, profissional: null, modalidade: null, convenio: null, livres: null, ate: null, data: null, horario: null, remarcar: remarcar || null };
  if (remarcar) {

    }
  }
}

      ? `<div class="info-msg"><b>Sem retorno.</b> Cada sessão de psicologia é paga individualmente.</div>`
      : `<div class="info-msg"><b>Retorno particular: 30 dias.</b> O retorno desta consulta pode ser agendado em até 30 dias após o atendimento.</div>`) : ''}
    ${conv && conv.valor == null && !/reembolso|^particular$/i.test(conv.nome) ? `<div class="info-msg">Leve a carteirinha do convênio e um documento com foto.</div>` : ''}
    <button class="btn btn-primario btn-bloco" data-a="agConfirmar" ${S.ocupado ? 'disabled' : ''}>${S.ocupado ? 'Confirmando…' : g.remarcar ? 'Confirmar novo horário' : 'Confirmar agendamento'}</button>`;
  }
  return `${barra}${voltar ? `<div>${voltar}</div>` : ''}${erroCaixa()}${corpo}`;
}

/* ---------- Meus agendamentos ---------- */
function linkWhats(acao, a) {
  const txt = `Olá! Preciso ${acao} minha ${a.servico.nome} com ${a.profissional.nome}, ${fmtDiaLongo(a.inicio)} às ${fmtHora(a.inicio)}.`;
  return `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(txt)}`;
}
function cartaoAg(a, futuro) {
  const pode = futuro && horasAte(a.inicio) >= CONFIG.ANTECEDENCIA_HORAS;
  const confirmando = S.cancelando === a.id;
  return `<article class="cartao ag">
    <div class="ag-cab"><div><h3>${esc(a.servico.nome)}</h3><p class="miudo">${esc(a.profissional.nome)}</p></div><span class="pilula st-${esc(a.status)}">${esc(STATUS[a.status] || a.status)}</span></div>
    <p class="ag-quando">${esc(fmtDiaLongo(a.inicio))} · ${fmtHora(a.inicio)}</p>
    ${a.medicacoes ? `<p class="miudo">${a.medicacoes.map(x => esc(x.nome)).join(' + ')} · ${a.pacote ? 'pacote já pago' : moeda(a.total)}</p>` : ''}
    ${futuro ? (confirmando ? `<div class="confirmar-caixa"><p>Cancelar este agendamento? O horário será liberado para outro paciente.</p>
        <div class="linha-botoes"><button class="btn btn-linha" data-a="cancelarNao">Manter</button><button class="btn btn-perigo" data-a="cancelarSim" data-v="${esc(a.id)}" ${S.ocupado ? 'disabled' : ''}>${S.ocupado ? 'Cancelando…' : 'Sim, cancelar'}</button></div></div>`
      : pode ? `${a.status === 'agendado' ? `<button class="btn btn-primario" data-a="confirmarPresenca" data-v="${esc(a.id)}" ${S.ocupado ? 'disabled' : ''}>Confirmar presença</button>` : ''}<div class="linha-botoes"><button class="btn btn-secundario" data-a="remarcar" data-v="${esc(a.id)}">Remarcar</button><button class="btn btn-linha" data-a="cancelarPedir" data-v="${esc(a.id)}">Cancelar</button></div>`
      : `${a.status === 'agendado' ? `<button class="btn btn-primario" data-a="confirmarPresenca" data-v="${esc(a.id)}" ${S.ocupado ? 'disabled' : ''}>Confirmar presença</button>` : ''}<div class="linha-botoes"><a class="btn btn-secundario" href="${linkWhats('remarcar', a)}" target="_blank" rel="noopener">Remarcar</a><a class="btn btn-linha" href="${linkWhats('cancelar', a)}" target="_blank" rel="noopener">Cancelar</a></div>
        <p class="miudo">Faltam menos de ${CONFIG.ANTECEDENCIA_HORAS}h: a alteração é feita pela recepção, pelo WhatsApp ${esc(CONFIG.WHATSAPP_EXIBIR)}.</p>`) : ''}
    ${futuro && PREPAROS[catDe(a.servico)] ? `<button class="btn-texto" data-a="verPreparo" data-v="${esc(catDe(a.servico))}">Ver preparo</button>` : ''}
    ${a.status === 'realizado' && !a.avaliado ? `<button class="btn btn-secundario" data-a="avaliar" data-v="${esc(a.id)}">${I.estrela.replace('<svg', '<svg width="18" height="18"')} Avaliar atendimento</button>` : ''}
    ${a.status === 'realizado' && a.avaliado ? '<p class="miudo">Obrigado pela avaliação.</p>' : ''}
  </article>`;
}
function telaAgenda() {
  if (!S.agendamentos) return carregando();
  const fut = S.abaLista === 'proximos', lista = fut ? proximos() : anteriores();
  return `<div class="cab-etapa"><h2>Meus agendamentos</h2></div>
  <div class="abas" role="group"><button data-a="abaLista" data-v="proximos" aria-pressed="${fut}">Próximos (${proximos().length})</button><button data-a="abaLista" data-v="anteriores" aria-pressed="${!fut}">Anteriores</button></div>
  ${erroCaixa()}
  ${lista.length ? lista.map(a => cartaoAg(a, fut)).join('') : `<div class="vazio">${I.lista}<p>${fut ? 'Nenhum atendimento marcado.' : 'Nenhum atendimento anterior.'}</p>${fut ? '<button class="btn btn-primario" data-a="ir" data-v="agendar">Agendar</button>' : ''}</div>`}`;
}

/* ---------- Preparo ---------- */
function telaPreparo() {
  return `<div class="cab-etapa"><h2>Preparo de exames</h2><p class="miudo">Siga as orientações para que o resultado saia correto. Se o seu médico passou outra orientação, siga a do médico.</p></div>
  ${Object.entries(PREPAROS).map(([k, p]) => `<details class="prep" id="prep-${k}" ${S.preparoAberto === k ? 'open' : ''}><summary>${esc(p.titulo)}</summary><p>${esc(p.texto)}</p><ul>${p.itens.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>`).join('')}
  <section class="cartao whats"><p class="rotulo">Ficou com dúvida?</p><p>Fale com a recepção pelo WhatsApp</p><p class="num">${esc(CONFIG.WHATSAPP_EXIBIR)}</p>
  <a class="btn btn-primario" href="https://wa.me/${esc(CONFIG.WHATSAPP)}" target="_blank" rel="noopener">${I.whats.replace('<svg', '<svg width="20" height="20"')} Abrir conversa</a></section>`;
}

/* ---------- Avaliação (NPS) ---------- */
function telaNps() {
  const a = (S.agendamentos || []).find(x => x.id === S.nps.id);
  if (!a) return carregando();
  const n = S.nps.nota;
  return `<div><button class="btn-texto" data-a="ir" data-v="agenda">${I.voltar} Voltar</button></div>
  <div class="cab-etapa"><p class="rotulo">Avaliação</p><h2>De 0 a 10, quanto você recomendaria a Clínica Pantheon a um amigo ou familiar?</h2>
  <p class="miudo">${esc(a.servico.nome)} · ${esc(fmtDiaCurto(a.inicio))}</p></div>
  ${erroCaixa()}
  <div class="escala" role="group" aria-label="Nota de 0 a 10">${Array.from({ length: 11 }, (_, i) => `<button data-a="npsNota" data-v="${i}" aria-pressed="${n === i}">${i}</button>`).join('')}</div>
  <div class="escala-leg"><span>Nada provável</span><span>Muito provável</span></div>
  <div class="campo"><label for="nps-coment">${n == null ? 'Quer comentar algo?' : n >= 9 ? 'O que mais gostou?' : n >= 7 ? 'O que faltou para ser nota 10?' : 'O que podemos melhorar?'} <span class="miudo">(opcional)</span></label>
  <textarea id="nps-coment" rows="3" maxlength="600">${esc(S.nps.comentario || '')}</textarea></div>
  <button class="btn btn-primario btn-bloco" data-a="npsEnviar" ${n == null || S.ocupado ? 'disabled' : ''}>${S.ocupado ? 'Enviando…' : 'Enviar avaliação'}</button>`;
}

/* ---------- Render ---------- */
function render() {
  const foco = document.activeElement && document.activeElement.id;
  const vals = {}; app.querySelectorAll('input[id],textarea[id]').forEach(e => { vals[e.id] = e.type === 'checkbox' ? e.checked : e.value });
  if (!S.token) app.innerHTML = telaLogin();
  else {
    const t = { inicio: telaInicio, agendar: telaAgendar, agenda: telaAgenda, preparo: telaPreparo, nps: telaNps }[S.tela] || telaInicio;
    app.innerHTML = moldura(t());
  }
  Object.entries(vals).forEach(([id, v]) => { const e = document.getElementById(id); if (e) { if (e.type === 'checkbox') e.checked = v; else if (!e.value) e.value = v } });
  if (foco) { const e = document.getElementById(foco); if (e) e.focus() }
}
async function ir(tela, extra) {
  S.tela = tela; S.erro = ''; S.cancelando = null; Object.assign(S, extra || {});
  if (tela === 'agendar' && !(extra && extra.ag)) novoFluxo();
  render(); window.scrollTo(0, 0);
  try {
    if (tela === 'inicio' || tela === 'agenda') await carregarAgendamentos();
    if (tela === 'agendar') await carregarServicos();
  } catch (e) { S.erro = e.message }
  render();
  if (tela === 'preparo' && S.preparoAberto) { const el = document.getElementById('prep-' + S.preparoAberto); if (el) el.scrollIntoView({ block: 'start' }) }
}
async function entrou(r) {
  S.token = r.token; S.nome = (r.paciente && r.paciente.nome) || '';
  if (!DEMO) { guardar.set('pp_token', S.token); guardar.set('pp_nome', S.nome) }
  S.erro = ''; S.ocupado = false; ir('inicio');
}

/* ---------- Eventos ---------- */
document.addEventListener('input', e => {
  if (e.target.dataset.mask === 'cpf') { const p = e.target.selectionStart === e.target.value.length; e.target.value = mascaraCPF(e.target.value); if (p) e.target.selectionStart = e.target.selectionEnd = e.target.value.length }
  if (e.target.id === 'nps-coment' && S.nps) S.nps.comentario = e.target.value;
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target), d = Object.fromEntries(f);
  S.erro = '';
  if (!cpfValido(d.cpf)) S.erro = 'Confira o CPF: os números não formam um CPF válido.';
  else if (e.target.id === 'f-entrar' && !d.senha) S.erro = 'Digite sua senha.';
  else if (e.target.id === 'f-primeiro') {
    if (String(d.nome || '').trim().split(/\s+/).length < 2) S.erro = 'Informe seu nome completo, com sobrenome.';
    else if (!d.nascimento) S.erro = 'Informe sua data de nascimento.';
    else if ((d.senha || '').length < 8) S.erro = 'A senha precisa ter pelo menos 8 caracteres.';
    else if (d.senha !== d.senha2) S.erro = 'As duas senhas não são iguais.';
    else if (!d.lgpd) S.erro = 'Para continuar, marque a autorização de uso dos dados.';
  }
  if (S.erro) return render();
  S.ocupado = true; render();
  try {
    const r = e.target.id === 'f-entrar'
      ? await api('POST', '/auth/entrar', { cpf: so(d.cpf), senha: d.senha })
      : await api('POST', '/auth/primeiro-acesso', { nome: d.nome.trim(), cpf: so(d.cpf), nascimento: d.nascimento, senha: d.senha });
    await entrou(r);
  } catch (err) { S.ocupado = false; S.erro = err.message; render() }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  const g = S.ag;
  try {
    switch (a) {
      case 'loginAba': S.loginAba = v; S.erro = ''; render(); break;
      case 'sair': sair(); break;
      case 'ir': ir(v); break;
      case 'verPreparo': ir('preparo', { preparoAberto: v }); break;
      case 'abaLista': S.abaLista = v; S.cancelando = null; render(); break;
      case 'agServico': {
        g.servico = v; g.profissional = null; g.modalidade = null; limparAgenda(g);
        const sv = svAtual(g);
        if (sv && sv.medicacoes) { g.profissional = sv.profissionais[0].id; g.itens = []; g.pacote = false; irPara('itens') } else irPara('prof');
        break;
      }
      case 'agItem': { const l = new Set(g.itens || []); l.has(v) ? l.delete(v) : l.add(v); g.itens = [...l]; render(); break }
      case 'agPacote': g.pacote = !g.pacote; render(); break;
      case 'agItensOk': {
        if (!itensSel(g).length) break;
        const mod = modalidadePelosItens(g);
        if (mod !== g.modalidade) { g.modalidade = mod; limparAgenda(g) }
        g.convenio = (modAtual(g).convenios.find(c => !c.whatsapp) || {}).id || null;
        irPara('hora'); break;
      }
      case 'agProf': {
        const pp = svAtual(g).profissionais.find(x => x.id === v); if (!pp || pp.disponivel === false) break;
        g.profissional = v; g.modalidade = pp.modalidades[0].id; limparAgenda(g);
        if (pp.modalidades.length > 1) { g.modalidade = null; irPara('modalidade'); break }
        const cs = modAtual(g).convenios;
        if (cs.length === 1) { g.convenio = cs[0].id; irPara('hora') }
        else { if (!cs.some(c => c.id === g.convenio && !c.whatsapp)) g.convenio = cs.some(c => c.id === guardar.get('pp_convenio')) ? guardar.get('pp_convenio') : null; irPara('convenio') }
        break;
      }
      case 'agMod': {
        g.modalidade = v; limparAgenda(g);
        const cs = modAtual(g).convenios;
        if (cs.length === 1) { g.convenio = cs[0].id; irPara('hora') } else irPara('convenio');
        break;
      }
      case 'agConv': g.convenio = v; g.plano = null; guardar.set('pp_convenio', v); limparAgenda(g); irPara(planosDe(convAtual(g)) ? 'plano' : 'hora'); break;
      case 'agPlano': g.plano = v; irPara('hora'); break;
      case 'agVoltar': { const ps = passos(g); g.horario = null; S.ag.etapa = ps[Math.max(0, ps.indexOf(g.etapa) - 1)]; S.erro = ''; render(); window.scrollTo(0, 0); break }
      case 'agMais': if (!g.buscando) await buscarDias(true); break;
      case 'agData': g.data = v; g.horario = null; S.erro = ''; render(); break;
      case 'agHora': g.horario = (g.livres || []).find(h => h.inicio === v); if (g.horario) irPara('conf'); break;
      case 'agConfirmar': {
        S.ocupado = true; S.erro = ''; render();
        const corpo = { servico: g.servico, profissional: g.profissional, modalidade: g.modalidade || '', convenio: g.convenio || '', plano: (planosDe(convAtual(g)) && g.plano) || '', inicio: g.horario.inicio, ...(svAtual(g).medicacoes ? { itens: g.itens, pacote: !!g.pacote } : {}) };
        if (g.remarcar) await api('POST', `/agendamentos/${encodeURIComponent(g.remarcar.id)}/remarcar`, corpo);
        else await api('POST', '/agendamentos', corpo);
        S.ocupado = false; const quando = `${fmtDiaCurto(g.horario.inicio)}, ${fmtHora(g.horario.inicio)}`;
        S.ag = null; S.agendamentos = null; S.abaLista = 'proximos';
        await ir('agenda'); toast((g.remarcar ? 'Remarcado para ' : 'Agendado: ') + quando);
        break;
      }
      case 'remarcar': {
        const ag = S.agendamentos.find(x => x.id === v);
        await carregarServicos();
        if (!S.servicos.some(s => s.id === ag.servico.id)) { S.erro = `Este atendimento só pode ser remarcado pela recepção: ${CONFIG.WHATSAPP_EXIBIR}.`; render(); window.scrollTo(0, 0); break }
        novoFluxo(ag); ir('agendar', { ag: S.ag });
        break;
      }
      case 'confirmarPresenca': {
        S.ocupado = true; render();
        await api('POST', `/agendamentos/${encodeURIComponent(v)}/confirmar`);
        S.ocupado = false; await carregarAgendamentos(true); render(); toast('Presença confirmada');
        break;
      }
      case 'cancelarPedir': S.cancelando = v; render(); break;
      case 'cancelarNao': S.cancelando = null; render(); break;
      case 'cancelarSim': {
        S.ocupado = true; render();
        await api('POST', `/agendamentos/${encodeURIComponent(v)}/cancelar`);
        S.ocupado = false; S.cancelando = null; await carregarAgendamentos(true); render(); toast('Agendamento cancelado');
        break;
      }
      case 'avaliar': S.nps = { id: v, nota: null, comentario: '' }; ir('nps'); break;
      case 'npsNota': S.nps.nota = +v; render(); break;
      case 'npsEnviar': {
        S.ocupado = true; render();
        await api('POST', '/nps', { agendamentoId: S.nps.id, nota: S.nps.nota, comentario: (S.nps.comentario || '').trim() });
        S.ocupado = false; const ag = S.agendamentos.find(x => x.id === S.nps.id); if (ag) ag.avaliado = true;
        S.nps = null; await ir('inicio'); toast('Obrigado! Sua avaliação foi enviada.');
        break;
      }
    }
  } catch (err) { S.ocupado = false; S.erro = err.message; if (S.ag && S.ag.data && !S.ag.horarios) S.ag.horarios = []; render(); window.scrollTo(0, 0) }
});

/* Instalação como app (funciona quando publicado no GitHub Pages) */
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update() });
    }).catch(() => {});
    // Quando uma versão nova assume, recarrega uma vez para mostrá-la
    let recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recarregou && navigator.serviceWorker.controller) { recarregou = true; location.reload() } });
  }
} catch (e) {}

if (S.token) ir('inicio'); else render();
</script>

</body>
